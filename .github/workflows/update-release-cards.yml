---
name: Update release cards

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Build container image
      - Build Nvidia container image
      - Build Dakota container image
    branches: [main]
    types: [completed]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: release-cards
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update
      - run: sudo apt-get install -y skopeo
      - name: Collect live release status
        run: node scripts/collect-release-status.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.event.repository.default_branch }}
          STATUS_OUTPUT_DIR: public/status
          STATUS_FALLBACK_BASE_URL: https://joshyorko.github.io/dudley-os/status
      - run: npm run cards:live
      - run: npm run cards:pages-check
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
