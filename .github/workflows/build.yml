---
name: Build container image
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'

env:
  IMAGE_NAME: "${{ github.event.repository.name }}"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  DEFAULT_TAG: "stable"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Dagger release pipeline
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "${GITHUB_ENV}"
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "${GITHUB_ENV}"

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Mount BTRFS for container storage
        id: container-storage-action
        uses: ublue-os/container-storage-action@dc1f4c8f17b672069e921f001132f7cf98a423a6 # main
        continue-on-error: true
        with:
          target-dir: /var/lib/containers
          mount-opts: compress-force=zstd:2

      - name: Build image with Dagger
        if: github.event_name == 'pull_request'
        uses: dagger/dagger-for-github@v8.3.0
        with:
          version: "v0.20.8"
          verb: call
          args: >-
            build
            --registry ${{ env.IMAGE_REGISTRY }}
            --image-name ${{ env.IMAGE_NAME }}
            --stable-tag ${{ env.DEFAULT_TAG }}
            --owner ${{ github.repository_owner }}
            --sha ${{ github.sha }}

      - name: Detect signing key
        id: signing-key
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
        shell: bash
        run: |
          if [[ -n "${SIGNING_SECRET}" ]]; then
            echo "configured=true" >> "${GITHUB_OUTPUT}"
          else
            echo "configured=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Release with Dagger and signing
        if: steps.signing-key.outputs.configured == 'true'
        uses: dagger/dagger-for-github@v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        with:
          version: "v0.20.8"
          verb: call
          args: >-
            release
            --registry ${{ env.IMAGE_REGISTRY }}
            --image-name ${{ env.IMAGE_NAME }}
            --registry-username ${{ github.actor }}
            --registry-password env:GITHUB_TOKEN
            --signing-key env:SIGNING_SECRET
            --signing-password env:SIGNING_PASSWORD
            --sha ${{ github.sha }}
            --ref-name ${{ github.ref_name }}
            --pipeline-url ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            --source-uri ${{ github.server_url }}/${{ github.repository }}
            --stable-tag ${{ env.DEFAULT_TAG }}
            --owner ${{ github.repository_owner }}

      - name: Release with Dagger without signing
        if: steps.signing-key.outputs.configured == 'false'
        uses: dagger/dagger-for-github@v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: "v0.20.8"
          verb: call
          args: >-
            release
            --registry ${{ env.IMAGE_REGISTRY }}
            --image-name ${{ env.IMAGE_NAME }}
            --registry-username ${{ github.actor }}
            --registry-password env:GITHUB_TOKEN
            --sha ${{ github.sha }}
            --ref-name ${{ github.ref_name }}
            --pipeline-url ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            --source-uri ${{ github.server_url }}/${{ github.repository }}
            --stable-tag ${{ env.DEFAULT_TAG }}
            --owner ${{ github.repository_owner }}
            --sign=false
            --attest=false
