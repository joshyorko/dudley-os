---
name: Validate release cards

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - cards/**
      - scripts/collect-release-status.mjs
      - scripts/generate-card-images.mjs
      - scripts/lib/card-template.mjs
      - scripts/lib/release-status.mjs
      - scripts/lib/status-collector.mjs
      - scripts/validate-pages-output.mjs
      - static/img/characters/**
      - static/img/cards/**
      - tests/fixtures/status/**
      - tests/test-card-assets.mjs
      - tests/test-pages-output.mjs
      - tests/test-release-status.mjs
      - tests/test-status-collector.mjs
      - README.md
      - .github/workflows/update-release-cards.yml
      - .github/workflows/validate-cards.yml
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - cards/**
      - scripts/collect-release-status.mjs
      - scripts/generate-card-images.mjs
      - scripts/lib/card-template.mjs
      - scripts/lib/release-status.mjs
      - scripts/lib/status-collector.mjs
      - scripts/validate-pages-output.mjs
      - static/img/characters/**
      - static/img/cards/**
      - tests/fixtures/status/**
      - tests/test-card-assets.mjs
      - tests/test-pages-output.mjs
      - tests/test-release-status.mjs
      - tests/test-status-collector.mjs
      - README.md
      - .github/workflows/update-release-cards.yml
      - .github/workflows/validate-cards.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:cards
      - run: npm run cards:check
