name: Cleanup Old Images

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}

jobs:
  delete-older-than-90:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete Images Older Than 90 Days
        uses: projectbluefin/actions/bootc-build/ghcr-cleanup@b2481faee5bad2f2a25b64d6269b06399a2f44c0 # v1
        with:
          packages: dudley-os
          older-than: 90 days
          keep-n-tagged: "7"
          keep-n-untagged: "7"
          github-token: ${{ secrets.GITHUB_TOKEN }}
