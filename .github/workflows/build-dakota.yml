---
name: Build Dakota container image

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'

env:
  IMAGE_DESC: "Dudley OS Dakota - file-only Dudley overlay on Project Bluefin Dakota"
  IMAGE_KEYWORDS: "bootc,ublue,universal-blue,dakota"
  IMAGE_LOGO_URL: "https://avatars.githubusercontent.com/u/120078124?s=200&v=4"
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGE_NAME: "${{ github.event.repository.name }}"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_push_dakota:
    name: Build and push ${{ matrix.tag }} image
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The Dudley installer embeds the NVIDIA image and selects the normal
        # image on non-NVIDIA hardware, so both tags are one release contract.
        include:
          - tag: dakota
            base_image_ref: "ghcr.io/projectbluefin/dakota:stable@sha256:a6916e9e298e1b86d2002232ac83cb377ab603aa39de1252789c01e8c34a5ac6"
          - tag: dakota-nvidia
            base_image_ref: "ghcr.io/projectbluefin/dakota-nvidia:stable@sha256:e0f9cce14b5643be3ad707d85bcd0308389f931e4aa2dcedfec0add2927fa08b"
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "${GITHUB_ENV}"
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "${GITHUB_ENV}"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup runner tools
        uses: projectbluefin/actions/bootc-build/setup-runner@a4bd91d1b36b3636ddb4140ae8be4406d642e877 # v1
        with:
          storage-backend: none
          install-tools: '["just"]'
      - name: Preflight publish
        id: preflight
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: projectbluefin/actions/bootc-build/preflight@a4bd91d1b36b3636ddb4140ae8be4406d642e877 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
      - name: Get current date
        id: date
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_OUTPUT}"
      - name: Image Metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: metadata
        with:
          tags: |
            type=raw,value=${{ matrix.tag }}
            type=raw,value=${{ matrix.tag }}.{{date 'YYYYMMDD'}}
            type=raw,value={{date 'YYYYMMDD'}}-${{ matrix.tag }}
            type=ref,event=pr,prefix=${{ matrix.tag }}-pr-
            type=sha,prefix=${{ matrix.tag }}-sha-
          labels: |
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/blob/${{ github.sha }}/Containerfile.dakota
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.version=${{ matrix.tag }}.{{date 'YYYYMMDD'}}
            io.artifacthub.package.keywords=${{ env.IMAGE_KEYWORDS }}
            containers.bootc=1
          sep-tags: " "
          sep-annotations: " "
      - name: Build Dakota image
        id: build_image
        shell: bash
        env:
          OCI_LABELS: ${{ steps.metadata.outputs.labels }}
        run: |
          set -euo pipefail
          export CONTAINERFILE=./Containerfile.dakota
          export BASE_IMAGE_REF="${{ matrix.base_image_ref }}"
          export METADATA_IMAGE="${IMAGE_REGISTRY}/${IMAGE_NAME}"
          export FINAL_IMAGE_REF="${IMAGE_REGISTRY}/${IMAGE_NAME}:${{ matrix.tag }}"
          sudo -E "$(command -v just)" build-ghcr "${IMAGE_NAME}" "${{ matrix.tag }}"
          echo "image=${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "tags=${{ matrix.tag }}" >> "${GITHUB_OUTPUT}"
      - name: Push To GHCR
        id: push
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: projectbluefin/actions/bootc-build/push-image@a4bd91d1b36b3636ddb4140ae8be4406d642e877 # v1
        with:
          image-name: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.metadata.outputs.tags }}
          default-tag: ${{ matrix.tag }}
          compression-format: zstd
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign image and publish provenance
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: projectbluefin/actions/bootc-build/sign-and-publish@a4bd91d1b36b3636ddb4140ae8be4406d642e877 # v1
        with:
          image: ${{ steps.preflight.outputs.image-ref }}
          digest: ${{ steps.push.outputs.digest }}
          signing-mode: keyless
          generate-sbom: "false"
          push-attestation: "true"
          certificate-identity-regexp: '^https://github\.com/joshyorko/dudley-os/\.github/workflows/build-dakota\.yml@refs/heads/main$'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
