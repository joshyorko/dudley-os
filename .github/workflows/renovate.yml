name: Dudley Bot Renovate
on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/renovate.json5'
      - '.github/workflows/renovate.yml'

concurrency:
  group: dudley-bot-renovate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  renovate:
    name: Dudley Bot dependency sweep
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      vulnerability-alerts: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Check Renovate token
        shell: bash
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          if [[ -z "${RENOVATE_TOKEN}" ]]; then
            echo "::error::RENOVATE_TOKEN is required. Use a bot PAT or GitHub App token with Contents, Pull requests, Issues, Vulnerability alerts, and Workflows permissions."
            exit 1
          fi

      - name: Run Dudley Bot Renovate
        uses: renovatebot/github-action@693b9ef15eec82123529a37c782242f091365961 # v46.1.14
        with:
          configurationFile: .github/renovate.json5
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_DEPENDENCY_DASHBOARD_TITLE: "Dudley Bot Dependency Dashboard"
          LOG_LEVEL: "debug"
