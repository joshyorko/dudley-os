name: Skill Drift

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  skill-drift:
    uses: projectbluefin/actions/.github/workflows/skill-drift-check.yml@6274199cfb6666180ac2fd0ad5a41bc8440e0929 # v1
    with:
      code-paths: '[".github/workflows/**", "build/**", "Containerfile", "Justfile", "tests/**"]'
      skill-paths: '["AGENTS.md", "README.md", "docs/**", ".github/skills/**"]'
