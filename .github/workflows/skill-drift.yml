name: Skill Drift

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  skill-drift:
    uses: projectbluefin/actions/.github/workflows/skill-drift-check.yml@7f8b3d26faad6b79b1201df818b1985ffc2221f2 # v1
    with:
      code-paths: '[".github/workflows/**", "build/**", "Containerfile", "Justfile", "tests/**"]'
      skill-paths: '["AGENTS.md", "README.md", "docs/**", ".github/skills/**"]'
