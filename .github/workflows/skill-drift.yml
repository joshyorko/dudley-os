name: Skill Drift

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  skill-drift:
    uses: projectbluefin/actions/.github/workflows/skill-drift-check.yml@9623ba6a5577ad1221d76a223c9dacbd9043bd04 # v1
    with:
      code-paths: '[".github/workflows/**", "build/**", "Containerfile", "Justfile", "tests/**"]'
      skill-paths: '["AGENTS.md", "README.md", "docs/**", ".github/skills/**"]'
