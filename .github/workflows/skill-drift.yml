name: Skill Drift

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  skill-drift:
    uses: projectbluefin/actions/.github/workflows/skill-drift-check.yml@72f37beb08b131f8a7f8c9615a0af54b3b942091 # v1
    with:
      code-paths: '[".github/workflows/**", "build/**", "Containerfile", "Justfile", "tests/**"]'
      skill-paths: '["AGENTS.md", "README.md", "docs/**", ".github/skills/**"]'
