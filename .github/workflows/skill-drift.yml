name: Skill Drift

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  skill-drift:
    uses: projectbluefin/actions/.github/workflows/skill-drift-check.yml@463259c95513eadc034d3d533f67ee97e3fac42a # v1
    with:
      code-paths: '[".github/workflows/**", "build/**", "Containerfile", "Justfile", "tests/**"]'
      skill-paths: '["AGENTS.md", "README.md", "docs/**", ".github/skills/**"]'
